# This workflow installs Python dependencies and runs the test suite across
# operating systems on every push/PR, and additionally runs a JAX-version
# compatibility matrix on a daily schedule.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Runs at 00:00 UTC every day. See https://crontab.guru for cron syntax.
    - cron: '0 0 * * *'
  workflow_dispatch:


permissions:
  contents: read  # to fetch code
  actions: write  # to cancel previous workflows

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Cross-platform test suite on push, pull request, and manual runs.
  test:
    if: github.event_name != 'schedule'
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements.txt --no-cache-dir
          python -m pip install pytest --no-cache-dir
          # Install the CPU extra so brainevent's numba-backed event/sparse
          # kernels are available to the cross-package compatibility tests.
          python -m pip install ".[cpu]" --no-cache-dir
      - name: Test with pytest
        run: |
          pytest BrainX/

  # Daily / manual JAX-version compatibility matrix on Linux.
  test_jax_compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: JAX compat (jax ${{ matrix.jax-version || 'latest' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]
        # One pinned leg per supported JAX minor, plus "" for the latest release.
        jax-version: [ "0.9.0", "0.10.0", "0.11.0", "" ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt
          python -m pip install pytest
          # Install the CPU extra (numba + jax[cpu]) first, then pin the matrix
          # JAX version last so it wins over the extra's resolved jax.
          python -m pip install ".[cpu]" || exit 1
          if [ "${{ matrix.jax-version }}" == "" ]; then
            python -m pip install jax || exit 1
          else
            python -m pip install jax==${{ matrix.jax-version }} || exit 1
          fi
      - name: Test with pytest
        run: |
          pytest BrainX/
